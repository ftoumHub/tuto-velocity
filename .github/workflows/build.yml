name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 8 : cible du projet ; 17 : vérifie le profil jdk9plus (--release 8)
        java: [8, 17]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Tests (JUnit + Cucumber)
        run: mvn --batch-mode test
